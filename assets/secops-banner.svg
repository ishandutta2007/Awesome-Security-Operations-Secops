<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#070B14"/><stop offset="40%" stop-color="#0B132B"/><stop offset="80%" stop-color="#0A1128"/><stop offset="100%" stop-color="#040810"/></linearGradient><linearGradient id="cyan-glow" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#00F0FF"/><stop offset="100%" stop-color="#3B82F6"/></linearGradient><linearGradient id="shield-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#00F0FF"/><stop offset="50%" stop-color="#3B82F6"/><stop offset="100%" stop-color="#8B5CF6"/></linearGradient><linearGradient id="radar-beam" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="rgba(0, 240, 255, 0.4)"/><stop offset="50%" stop-color="rgba(59, 130, 246, 0.15)"/><stop offset="100%" stop-color="transparent"/></linearGradient><radialGradient id="center-glow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="rgba(0, 240, 255, 0.12)"/><stop offset="100%" stop-color="transparent"/></radialGradient><pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="rgba(0, 240, 255, 0.05)" stroke-width="1" d="M 40 0 L 0 0 0 40"/><circle cx="40" cy="40" r="1.5" fill="rgba(0, 240, 255, 0.15)"/></pattern><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="soft-glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="4"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><style>@keyframes pulse-glow{0%{opacity:.3;transform:scale(1)}50%{opacity:.7;transform:scale(1.05)}}@keyframes shield-float{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes particle-travel{0%{transform:translate(0,0);opacity:0}20%,80%
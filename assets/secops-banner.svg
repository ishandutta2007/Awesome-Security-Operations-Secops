<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="40%" stop-color="#0B132B"/>
      <stop offset="80%" stop-color="#0A1128"/>
      <stop offset="100%" stop-color="#040810"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <linearGradient id="radar-beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(0, 240, 255, 0.4)"/>
      <stop offset="50%" stop-color="rgba(59, 130, 246, 0.15)"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>

    <radialGradient id="center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(0, 240, 255, 0.12)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 240, 255, 0.05)" stroke-width="1"/>
      <circle cx="40" cy="40" r="1.5" fill="rgba(0, 240, 255, 0.15)"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes radar-spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes pulse-glow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.05); }
      }
      @keyframes shield-float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes particle-travel {
        0% { transform: translate(0, 0); opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { transform: translate(120px, 0); opacity: 0; }
      }
      @keyframes live-blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
      @keyframes circuit-dash {
        to { stroke-dashoffset: -100; }
      }
      .radar-sweep {
        transform-origin: 1020px 180px;
        animation: radar-spin 8s linear infinite;
      }
      .shield-anim {
        transform-origin: 100px 180px;
        animation: shield-float 4s ease-in-out infinite;
      }
      .pulse-bg {
        animation: pulse-glow 5s ease-in-out infinite;
      }
      .live-dot {
        animation: live-blink 1.8s ease-in-out infinite;
      }
      .circuit-line {
        stroke-dasharray: 8, 8;
        animation: circuit-dash 4s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)"/>
  <rect width="1200" height="360" rx="16" fill="url(#cyber-grid)"/>

  <!-- Ambient Glow Backdrops -->
  <circle cx="200" cy="180" r="220" fill="url(#center-glow)" class="pulse-bg"/>
  <circle cx="1020" cy="180" r="180" fill="url(#center-glow)" class="pulse-bg"/>

  <!-- Left Side: Animated Cyber Shield Icon -->
  <g class="shield-anim" transform="translate(40, 100)">
    <!-- Outer Glow Shield -->
    <path d="M60 20 L110 40 V90 C110 130 60 160 60 160 C60 160 10 130 10 90 V40 Z" 
          fill="none" stroke="url(#shield-grad)" stroke-width="3" filter="url(#soft-glow)"/>
    <!-- Inner Shield -->
    <path d="M60 35 L95 50 V85 C95 115 60 140 60 140 C60 140 25 115 25 85 V50 Z" 
          fill="rgba(0, 240, 255, 0.08)" stroke="#00F0FF" stroke-width="1.5"/>
    <!-- Shield Core Elements: Crosshair & Key -->
    <circle cx="60" cy="85" r="18" fill="none" stroke="#3B82F6" stroke-width="2"/>
    <circle cx="60" cy="85" r="6" fill="#00F0FF"/>
    <line x1="60" y1="58" x2="60" y2="112" stroke="rgba(0, 240, 255, 0.6)" stroke-width="1.5"/>
    <line x1="33" y1="85" x2="87" y2="85" stroke="rgba(0, 240, 255, 0.6)" stroke-width="1.5"/>
  </g>

  <!-- Animated Circuit Lines Behind Content -->
  <g opacity="0.35">
    <path class="circuit-line" d="M 180 80 L 320 80 L 350 110 L 520 110" fill="none" stroke="#00F0FF" stroke-width="1.5"/>
    <path class="circuit-line" d="M 180 280 L 290 280 L 330 250 L 580 250" fill="none" stroke="#3B82F6" stroke-width="1.5"/>
    <circle cx="520" cy="110" r="3" fill="#00F0FF"/>
    <circle cx="580" cy="250" r="3" fill="#3B82F6"/>
  </g>

  <!-- Right Side: Radar / Threat Radar Animation -->
  <g id="radar-system">
    <!-- Concentric Target Circles -->
    <circle cx="1020" cy="180" r="130" fill="none" stroke="rgba(0, 240, 255, 0.15)" stroke-width="1"/>
    <circle cx="1020" cy="180" r="95" fill="none" stroke="rgba(0, 240, 255, 0.2)" stroke-width="1"/>
    <circle cx="1020" cy="180" r="60" fill="none" stroke="rgba(0, 240, 255, 0.25)" stroke-width="1.2"/>
    <circle cx="1020" cy="180" r="25" fill="none" stroke="rgba(0, 240, 255, 0.4)" stroke-width="1.5"/>
    <!-- Radar Axis Lines -->
    <line x1="880" y1="180" x2="1160" y2="180" stroke="rgba(0, 240, 255, 0.2)" stroke-width="1"/>
    <line x1="1020" y1="40" x2="1020" y2="320" stroke="rgba(0, 240, 255, 0.2)" stroke-width="1"/>
    <line x1="928" y1="88" x2="1112" y2="272" stroke="rgba(0, 240, 255, 0.1)" stroke-width="1"/>
    <line x1="928" y1="272" x2="1112" y2="88" stroke="rgba(0, 240, 255, 0.1)" stroke-width="1"/>
    
    <!-- Rotating Sweep Beam -->
    <g class="radar-sweep">
      <path d="M 1020 180 L 1150 180 A 130 130 0 0 0 1020 50 Z" fill="url(#radar-beam)"/>
      <line x1="1020" y1="180" x2="1150" y2="180" stroke="#00F0FF" stroke-width="1.8" filter="url(#soft-glow)"/>
    </g>

    <!-- Detected Threat / Blip Targets -->
    <g>
      <circle cx="980" cy="130" r="4" fill="#EF4444" filter="url(#soft-glow)" class="live-dot"/>
      <circle cx="980" cy="130" r="8" fill="none" stroke="#EF4444" stroke-width="1" opacity="0.6"/>
      <circle cx="1070" cy="150" r="3.5" fill="#F59E0B" filter="url(#soft-glow)"/>
      <circle cx="1040" cy="230" r="3" fill="#10B981" filter="url(#soft-glow)"/>
      <circle cx="950" cy="220" r="3.5" fill="#00F0FF" filter="url(#soft-glow)"/>
    </g>
  </g>

  <!-- Foreground Content: Header, Badges, Typography (Crisp & Clear) -->
  <g transform="translate(180, 0)">
    <!-- Top Pill: Status & Category -->
    <g transform="translate(0, 52)">
      <rect width="270" height="30" rx="15" fill="rgba(0, 240, 255, 0.08)" stroke="rgba(0, 240, 255, 0.3)" stroke-width="1"/>
      <circle cx="18" cy="15" r="5" fill="#10B981" class="live-dot" filter="url(#soft-glow)"/>
      <text x="32" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#00F0FF" letter-spacing="1.5">
        SECURITY OPERATIONS RADAR
      </text>
    </g>

    <!-- Main Title -->
    <text x="0" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">
      Awesome <tspan fill="url(#cyan-glow)" filter="url(#soft-glow)">SecOps</tspan>
    </text>

    <!-- Subtitle -->
    <text x="2" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#E2E8F0" letter-spacing="0.2">
      Enterprise Platforms &amp; Open-Source Defense Ecosystem
    </text>

    <!-- Tagline description -->
    <text x="2" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#94A3B8">
      Curated SIEM • SOAR • Threat Detection &amp; Hunting • Incident Response Automation
    </text>

    <!-- Feature Tag Pills -->
    <g transform="translate(2, 248)">
      <!-- Pill 1: SIEM -->
      <g transform="translate(0, 0)">
        <rect width="115" height="28" rx="6" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(59, 130, 246, 0.4)" stroke-width="1"/>
        <text x="57" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#93C5FD">📊 SIEM &amp; Logs</text>
      </g>
      <!-- Pill 2: SOAR -->
      <g transform="translate(125, 0)">
        <rect width="125" height="28" rx="6" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(139, 92, 246, 0.4)" stroke-width="1"/>
        <text x="62" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#C4B5FD">⚡ SOAR Playbooks</text>
      </g>
      <!-- Pill 3: Threat Detection -->
      <g transform="translate(260, 0)">
        <rect width="145" height="28" rx="6" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(0, 240, 255, 0.4)" stroke-width="1"/>
        <text x="72" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#67E8F9">🎯 Threat Detection</text>
      </g>
      <!-- Pill 4: Incident Response -->
      <g transform="translate(415, 0)">
        <rect width="145" height="28" rx="6" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1"/>
        <text x="72" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#6EE7B7">🛡️ Incident Response</text>
      </g>
    </g>
  </g>

  <!-- Border Frame Glow -->
  <rect width="1198" height="358" x="1" y="1" rx="15" fill="none" stroke="rgba(0, 240, 255, 0.2)" stroke-width="1"/>
</svg>
